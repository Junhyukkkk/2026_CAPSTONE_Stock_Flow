# 포트 정책: 외부(인터넷)에는 서비스 화면 8081 만 연다. 나머지 관리 도구 · DB · 브로커는 127.0.0.1 로만 열고
# SSH 터널로 접속한다(RUNBOOK.md '관리 도구 접속'). 새 서비스를 추가할 때도 이 규칙을 따른다.

services:
  # TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: stockflow-timescaledb
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - timescale-data:/var/lib/postgresql/data

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: stockflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stockflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 4
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      # 명시적 named volume — docker compose down 해도 토픽·오프셋 유지 (down -v 로만 삭제)
      - kafka-data:/var/lib/kafka/data

  # Kafka 토픽 생성 (1회성)
  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stockflow-kafka-setup
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "kafka 준비 대기..."
        for i in $$(seq 1 30); do
          kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
          sleep 2
        done
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic market.normalized --partitions 12 --replication-factor 1 --config retention.ms=14400000
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic market.retry      --partitions 6  --replication-factor 1 --config retention.ms=14400000
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic market.dlq        --partitions 3  --replication-factor 1 --config retention.ms=604800000
        echo "토픽 생성 완료"; kafka-topics --bootstrap-server kafka:9092 --list
    restart: "no"

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: stockflow-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no

  # Monitoring UI
  # Kafka UI 는 기본으로 띄우지 않는다(필요할 때만: docker compose --profile kafka-ui up -d kafka-ui).
  # 2026-09-26 인증 없이 외부에 공개된 provectuslabs/kafka-ui:latest(개발 중단, 원격 코드 실행 취약점)가
  # 재기동 3분 만에 침입당해 암호화폐 채굴에 쓰였다. 유지되는 후속 프로젝트(kafbat) 버전을 고정하고,
  # 런타임 설정 변경을 끄며, 포트는 서버 내부에서만 열어 SSH 터널로 접속한다.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: stockflow-kafka-ui
    profiles: ["kafka-ui"]
    ports:
      - "127.0.0.1:8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: stockflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: stockflow-redis-insight
    ports:
      - "127.0.0.1:5540:5540"
  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: stockflow-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - stockflow-realtime

  # Alertmanager - Prometheus 경보 라우팅
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: stockflow-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    depends_on:
      - prometheus

  # Alertmanager → Discord 브릿지 (webhook JSON → Discord 임베드)
  # DISCORD_WEBHOOK (infra/.env) 이 비어 있으면 경보는 발동·라우팅되지만 Discord 로는 안 감.
  alertmanager-discord:
    image: benjojo/alertmanager-discord:latest
    container_name: stockflow-alertmanager-discord
    environment:
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK:-}
    restart: unless-stopped
    depends_on:
      - alertmanager

  # Loki - 로그 수집 저장소
  loki:
    image: grafana/loki:3.1.1
    container_name: stockflow-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # Promtail - 컨테이너 로그를 Loki 로 전달
  promtail:
    image: grafana/promtail:3.1.1
    container_name: stockflow-promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: stockflow-grafana
    ports:
      # 호스트 3000 이 이미 쓰이는 경우가 많아 3001 로 노출 (GRAFANA_PORT 로 변경 가능)
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ../docs/01-kafka-dashboard.json:/var/lib/grafana/dashboards/01-kafka-dashboard.json
      - ../docs/02-jvm-dashboard.json:/var/lib/grafana/dashboards/02-jvm-dashboard.json
      - ../docs/03-redis-hikari-dashboard.json:/var/lib/grafana/dashboards/03-redis-hikari-dashboard.json
      - ../docs/04-http-logs-dashboard.json:/var/lib/grafana/dashboards/04-http-logs-dashboard.json
      - ../docs/05-app-custom-dashboard.json:/var/lib/grafana/dashboards/05-app-custom-dashboard.json
      - ../docs/06-consumer-lag-dashboard.json:/var/lib/grafana/dashboards/06-consumer-lag-dashboard.json
      - ../docs/07-logs-dashboard.json:/var/lib/grafana/dashboards/07-logs-dashboard.json
    depends_on:
      - prometheus
      - loki

  # Spring Boot Consumer
  stockflow-realtime:
    build:
      context: ..
      dockerfile: Dockerfile
    image: stockflow-app:local      # stockflow-storage(split 프로파일)가 재사용
    container_name: stockflow-realtime
    ports:
      - "8081:8081"
    environment:
      # Spring Profile (loki: logback → Loki appender 활성)
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-loki}
      # Kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP_REALTIME=realtime-group
      - KAFKA_CONSUMER_GROUP_STORAGE=storage-group
      - KAFKA_MAX_POLL_INTERVAL_MS=${KAFKA_MAX_POLL_INTERVAL_MS:-300000}
      - KAFKA_CONSUMER_CONCURRENCY=${KAFKA_CONSUMER_CONCURRENCY:-12}
      - KAFKA_CONSUMER_MAX_POLL_RECORDS=${KAFKA_CONSUMER_MAX_POLL_RECORDS:-100}
      # 컨슈머/배치 on-off — split 프로파일로 저장 경로를 분리할 때 이 인스턴스는 저장·배치를 끈다.
      # 단일 프로세스로 쓰면 셋 다 기본 true (기존 동작).
      - REALTIME_CONSUMER_ENABLED=${REALTIME_CONSUMER_ENABLED:-true}
      - STORAGE_CONSUMER_ENABLED=${STORAGE_CONSUMER_ENABLED:-true}
      - BATCH_SCHEDULER_ENABLED=${BATCH_SCHEDULER_ENABLED:-true}
      # 성능 개선안 토글 (부하 테스트로 검증됨 — 기본 ON, bench.sh 는 자체 컨테이너로 A/B)
      # redis/idempotency 파이프라인은 commons-pool2(커넥션 풀) 의존성이 있어야 이득이 있다.
      - STOCKFLOW_OPT_INSTRUMENT_CACHE=${STOCKFLOW_OPT_INSTRUMENT_CACHE:-true}
      - STOCKFLOW_OPT_PREV_CLOSE_LOCAL_CACHE=${STOCKFLOW_OPT_PREV_CLOSE_LOCAL_CACHE:-true}
      - STOCKFLOW_OPT_WS_TASK_EXECUTOR=${STOCKFLOW_OPT_WS_TASK_EXECUTOR:-true}
      - STOCKFLOW_OPT_REDIS_PIPELINE=${STOCKFLOW_OPT_REDIS_PIPELINE:-true}
      - STOCKFLOW_OPT_STORAGE_IDEMPOTENCY_PIPELINE=${STOCKFLOW_OPT_STORAGE_IDEMPOTENCY_PIPELINE:-true}
      - STOCKFLOW_OPT_REALTIME_BATCH=${STOCKFLOW_OPT_REALTIME_BATCH:-false}
      # 저장 경로 튜닝 — 서버 측정으로 검증된 기본값 (옛 동작으로 되돌리려면 TTL=86400, KAFKA_STORAGE_*=100/1/500)
      - STOCKFLOW_IDEMPOTENCY_TTL_SECONDS=${STOCKFLOW_IDEMPOTENCY_TTL_SECONDS:-600}
      - KAFKA_STORAGE_MAX_POLL_RECORDS=${KAFKA_STORAGE_MAX_POLL_RECORDS:-500}
      - KAFKA_STORAGE_FETCH_MIN_BYTES=${KAFKA_STORAGE_FETCH_MIN_BYTES:-65536}
      - KAFKA_STORAGE_FETCH_MAX_WAIT_MS=${KAFKA_STORAGE_FETCH_MAX_WAIT_MS:-100}
      - REDIS_PIPELINE_FLUSH=${REDIS_PIPELINE_FLUSH:-each}
      - STOCKFLOW_E2E_SAMPLE_EVERY=${STOCKFLOW_E2E_SAMPLE_EVERY:-1}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Database
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=stockflow
      - DB_USERNAME=postgres
      # FastAPI prediction service (separate compose, same infra_default network)
      - ANALYSIS_BASE_URL=${ANALYSIS_BASE_URL:-http://analysis:8000}
      - DB_PASSWORD=postgres
      # 로그 수집 (Loki) — 콘솔은 DEBUG, Loki 로는 LOKI_MIN_LEVEL(기본 INFO) 이상만 전송
      - LOKI_URL=${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      - LOKI_MIN_LEVEL=${LOKI_MIN_LEVEL:-INFO}
      # 에러 트래킹 (Sentry / GlitchTip) - DSN 비어 있으면 자동 비활성
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-docker-local}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      # Retry Policy
      - RETRY_MODE=${RETRY_MODE:-sync}
      - RETRY_MAX_RETRIES=${RETRY_MAX_RETRIES:-3}
      - RETRY_DELAY_MS=${RETRY_DELAY_MS:-5000}
      - RETRY_INITIAL_DELAY_MS=${RETRY_INITIAL_DELAY_MS:-1000}
      - RETRY_MULTIPLIER=${RETRY_MULTIPLIER:-2.0}
      - RETRY_MAX_DELAY_MS=${RETRY_MAX_DELAY_MS:-60000}
      - RETRY_USE_JITTER=${RETRY_USE_JITTER:-true}
      - RETRY_JITTER_RATIO=${RETRY_JITTER_RATIO:-0.2}
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
      timescaledb:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---- 저장 전용 인스턴스 (docker compose --profile split up -d) ----
  # 실시간 경로와 저장 경로의 CPU 경합을 없애기 위해 저장·배치를 별도 프로세스로 분리한다.
  # 이걸 켤 때는 infra/.env 에 아래를 넣어 realtime 인스턴스의 저장·배치를 꺼야 한다:
  #   STORAGE_CONSUMER_ENABLED=false
  #   BATCH_SCHEDULER_ENABLED=false
  stockflow-storage:
    image: stockflow-app:local
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: stockflow-storage
    profiles: ["split"]
    ports:
      - "127.0.0.1:8082:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-loki}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP_REALTIME=realtime-group
      - KAFKA_CONSUMER_GROUP_STORAGE=storage-group
      - KAFKA_CONSUMER_CONCURRENCY=${KAFKA_CONSUMER_CONCURRENCY:-12}
      - KAFKA_CONSUMER_MAX_POLL_RECORDS=${KAFKA_CONSUMER_MAX_POLL_RECORDS:-100}
      # 이 인스턴스는 저장 + 배치만
      - REALTIME_CONSUMER_ENABLED=false
      - STORAGE_CONSUMER_ENABLED=true
      - BATCH_SCHEDULER_ENABLED=true
      - STOCKFLOW_OPT_INSTRUMENT_CACHE=${STOCKFLOW_OPT_INSTRUMENT_CACHE:-true}
      - STOCKFLOW_OPT_STORAGE_IDEMPOTENCY_PIPELINE=${STOCKFLOW_OPT_STORAGE_IDEMPOTENCY_PIPELINE:-true}
      # 저장 경로 튜닝 — 서버 측정으로 검증된 기본값 (옛 동작으로 되돌리려면 TTL=86400, KAFKA_STORAGE_*=100/1/500)
      - STOCKFLOW_IDEMPOTENCY_TTL_SECONDS=${STOCKFLOW_IDEMPOTENCY_TTL_SECONDS:-600}
      - KAFKA_STORAGE_MAX_POLL_RECORDS=${KAFKA_STORAGE_MAX_POLL_RECORDS:-500}
      - KAFKA_STORAGE_FETCH_MIN_BYTES=${KAFKA_STORAGE_FETCH_MIN_BYTES:-65536}
      - KAFKA_STORAGE_FETCH_MAX_WAIT_MS=${KAFKA_STORAGE_FETCH_MAX_WAIT_MS:-100}
      - REDIS_PIPELINE_FLUSH=${REDIS_PIPELINE_FLUSH:-each}
      - STOCKFLOW_E2E_SAMPLE_EVERY=${STOCKFLOW_E2E_SAMPLE_EVERY:-1}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=stockflow
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - LOKI_URL=${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      - LOKI_MIN_LEVEL=${LOKI_MIN_LEVEL:-INFO}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - RETRY_MODE=${RETRY_MODE:-sync}
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
      timescaledb:
        condition: service_started
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---- 실시간 데이터 수집기 (Binance 암호화폐, 키 불필요, 24시간) ----
  binance-collector:
    build:
      context: ../../collectors
      dockerfile: Dockerfile
    container_name: stockflow-binance-collector
    command: python binance_producer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_NAME=market.normalized
      - BINANCE_TOP_SYMBOLS_LIMIT=${BINANCE_TOP_SYMBOLS_LIMIT:-0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---- Alpaca 미국 주식 수집기 (API 키 필요, 장중에만 데이터) ----
  # 실행: docker compose --profile alpaca up -d
  alpaca-collector:
    build:
      context: ../../collectors
      dockerfile: Dockerfile
    container_name: stockflow-alpaca-collector
    command: python alpaca_producer.py
    profiles: ["alpaca"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - ALPACA_WEBSOCKET_URL=${ALPACA_WEBSOCKET_URL:-wss://stream.data.alpaca.markets/v2/iex}
      - KAFKA_TOPIC_NAME=market.normalized
      - ALPACA_SUBSCRIBE_ALL_STOCKS=${ALPACA_SUBSCRIBE_ALL_STOCKS:-true}
      - ALPACA_SUBSCRIBE_SYMBOLS=${ALPACA_SUBSCRIBE_SYMBOLS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - kafka
    restart: unless-stopped

  # ---- 미국 주식 시세 시뮬레이터 (가짜 체결 생성기, 유료 시세 대체) ----
  # ⚠️ source=SIMULATOR / exchange=SIM 인 시뮬레이션 데이터다. 실제 시세가 아니므로 분석·백테스트 해석에 주의.
  # 실행: docker compose --profile sim up -d stock-simulator   (기본 up 에는 포함되지 않는다)
  # SIM_PRICE_SOURCE=auto|alpaca 이면 ALPACA_API_KEY/SECRET 으로 시작가만 실제 시세에서 읽는다(실패 시 CSV 가격).
  stock-simulator:
    build:
      context: ../../collectors
      dockerfile: Dockerfile
    container_name: stockflow-stock-simulator
    command: python stock_simulator.py
    profiles: ["sim"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_NAME=market.normalized
      - SIM_SYMBOLS_FILE=${SIM_SYMBOLS_FILE:-simulator/universe.csv}
      # 발생률 모드: realistic(기본) = 종목별 실제 하루 체결 수(universe.csv daily_trades) 기반, SIM_TOTAL_TPS 는 무시된다
      - SIM_RATE_MODE=${SIM_RATE_MODE:-realistic}
      # realistic 발생률 배율. 1.0 이면 합계 평균 약 832 TPS(하루 약 1,950만 건)라 서버 보호용 기본값은 0.25 (평균 약 208 TPS)
      - SIM_RATE_SCALE=${SIM_RATE_SCALE:-0.25}
      # SIM_TOTAL_TPS 는 SIM_RATE_MODE=fixed 일 때만 쓰인다(weight 비례 고정 발생률)
      - SIM_TOTAL_TPS=${SIM_TOTAL_TPS:-100}
      - SIM_MARKET_HOURS=${SIM_MARKET_HOURS:-always}
      - SIM_SEED=${SIM_SEED:-}
      - SIM_DRY_RUN=${SIM_DRY_RUN:-false}
      - SIM_TICK_INTERVAL_MS=${SIM_TICK_INTERVAL_MS:-50}
      - SIM_PRICE_SOURCE=${SIM_PRICE_SOURCE:-static}
      # 출력 source 값·tradeId 접두어. 부하 테스트는 SIMLOAD 처럼 따로 두면 source 한 가지로 지울 수 있다
      - SIM_SOURCE_LABEL=${SIM_SOURCE_LABEL:-SIMULATOR}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # kafka-setup 이 market.normalized(12 파티션)를 만든 뒤에 기동해야 한다.
    # 그 전에 프로듀서가 토픽을 자동 생성하면 브로커 기본 파티션 수(6)로 만들어진다.
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---- 캔들 동기화 · 거래소 백필 · 결측 복구 (market-data-sync/README.md) ----
  # ohlcv_1m 스키마(V16)는 stockflow-realtime 의 Flyway 가 만든다. 스키마가 생기기 전의 실패는
  # 작업마다 로그만 남기고 다음 주기에 다시 시도한다.
  market-data-sync:
    build:
      context: ../../market-data-sync
      dockerfile: Dockerfile
    container_name: stockflow-market-data-sync
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=stockflow
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # 운영 중인 수집 · 실시간 경로에 영향이 없도록 자원을 제한한다.
    cpus: 1.0
    mem_limit: 512m
    depends_on:
      - timescaledb
    restart: unless-stopped

  # ---- Sentry 호환 에러 트래킹 (GlitchTip) ----
  # 실행: docker compose --profile sentry up -d
  # 이후 http://localhost:8000 에서 계정/프로젝트 생성 → DSN 을 .env 의 SENTRY_DSN 에 넣고
  #      docker compose up -d stockflow-realtime 로 앱만 재기동
  glitchtip-postgres:
    image: postgres:16-alpine
    container_name: stockflow-glitchtip-postgres
    profiles: ["sentry"]
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - glitchtip-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitchtip-web:
    image: glitchtip/glitchtip:v4.1.1
    container_name: stockflow-glitchtip
    profiles: ["sentry"]
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8080"
    environment: &glitchtip-env
      DATABASE_URL: postgres://postgres:postgres@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-stockflow-local-dev-secret-key-change-me}
      PORT: "8080"
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:8000
      DEFAULT_FROM_EMAIL: stockflow@example.com
      REDIS_URL: redis://redis:6379/2
      ENABLE_OPEN_USER_REGISTRATION: "true"
      CELERY_WORKER_AUTOSCALE: "1,3"
    restart: unless-stopped

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.1.1
    container_name: stockflow-glitchtip-worker
    profiles: ["sentry"]
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
    environment: *glitchtip-env
    restart: unless-stopped

  glitchtip-migrate:
    image: glitchtip/glitchtip:v4.1.1
    container_name: stockflow-glitchtip-migrate
    profiles: ["sentry"]
    command: ./bin/run-migrate.sh
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
    environment: *glitchtip-env
    restart: "no"

  # ---- 부하 생성기 (docker compose --profile loadgen run --rm loadgen) ----
  # backend/perf/tps-sweep.sh 가 rate 를 -e 로 넘겨 반복 호출한다.
  # 수집기와 같은 이미지(전송 설정 동일)를 쓰고, /perf 만 마운트한다.
  loadgen:
    build:
      context: ../../collectors
      dockerfile: Dockerfile
    image: stockflow-collectors
    container_name: stockflow-loadgen
    profiles: ["loadgen"]
    working_dir: /app
    volumes:
      - ../perf:/perf
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONPATH=/app
      - RATE=${RATE:-500}
      - DURATION=${DURATION:-60}
      - WORKERS=${WORKERS:-6}
      - SYMBOLS=${SYMBOLS:-50}
      - BATCH_TICK_MS=${BATCH_TICK_MS:-5}
      - KAFKA_LINGER_MS=${KAFKA_LINGER_MS:-10}
      - TOPIC=${TOPIC:-market.normalized}
    command: ["python", "/perf/loadgen.py"]
    restart: "no"

  # ---- 메트릭 exporter (docker compose --profile metrics up -d) ----
  # 기본 스택엔 앱 1개만 스크레이프돼서 Grafana 의 kafka/redis/host 패널이 비어 있다.
  # 이 프로파일을 켜면 채워진다. 기본 up -d 동작에는 영향 없음.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: stockflow-kafka-exporter
    profiles: ["metrics"]
    command: ["--kafka.server=kafka:9092", "--web.listen-address=:9308"]
    ports:
      - "127.0.0.1:9308:9308"
    depends_on:
      - kafka
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: stockflow-redis-exporter
    profiles: ["metrics"]
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      - redis
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: stockflow-node-exporter
    profiles: ["metrics"]
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: stockflow-cadvisor
    profiles: ["metrics"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8088:8080"
    restart: unless-stopped

volumes:
  timescale-data:      # 원본 틱·일봉·지표·백테스트·배치이력 (진짜 데이터)
  kafka-data:          # Kafka 토픽 로그·컨슈머 오프셋
  zookeeper-data:
  zookeeper-log:
  prometheus-data:     # 메트릭 (7d 보관)
  alertmanager-data:   # 경보 상태(silence 등)
  grafana-data:        # Grafana 내부 상태
  loki-data:           # 수집된 로그 (72h 보관)
  glitchtip-pg-data:   # GlitchTip 계정·프로젝트·이슈
