version: '3.8'
services:
  # TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: stockflow-timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - timescale-data:/var/lib/postgresql/data

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: stockflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stockflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 4
      KAFKA_NUM_PARTITIONS: 6

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: stockflow-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no

  # Monitoring UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stockflow-kafka-ui
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: stockflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: stockflow-redis-insight
    ports:
      - "5540:5540"

  # Spring Boot Consumer
  stockflow-realtime:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: stockflow-realtime
    ports:
      - "8081:8081"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-test}
      # Kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP_REALTIME=realtime-group
      - KAFKA_CONSUMER_GROUP_STORAGE=storage-group
      - KAFKA_MAX_POLL_INTERVAL_MS=${KAFKA_MAX_POLL_INTERVAL_MS:-300000}
      - KAFKA_CONSUMER_CONCURRENCY=${KAFKA_CONSUMER_CONCURRENCY:-12}
      - KAFKA_CONSUMER_MAX_POLL_RECORDS=${KAFKA_CONSUMER_MAX_POLL_RECORDS:-100}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Database
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=stockflow
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      # Retry Policy
      - RETRY_MAX_RETRIES=${RETRY_MAX_RETRIES:-3}
      - RETRY_DELAY_MS=${RETRY_DELAY_MS:-5000}
      - RETRY_INITIAL_DELAY_MS=${RETRY_INITIAL_DELAY_MS:-1000}
      - RETRY_MULTIPLIER=${RETRY_MULTIPLIER:-2.0}
      - RETRY_MAX_DELAY_MS=${RETRY_MAX_DELAY_MS:-60000}
      - RETRY_USE_JITTER=${RETRY_USE_JITTER:-true}
      - RETRY_JITTER_RATIO=${RETRY_JITTER_RATIO:-0.2}
    depends_on:
      - kafka
      - redis
      - timescaledb
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  timescale-data:
