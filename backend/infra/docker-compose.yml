version: '3.8'
services:
  # TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: stockflow-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - timescale-data:/var/lib/postgresql/data

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: stockflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stockflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 4
      KAFKA_NUM_PARTITIONS: 6

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: stockflow-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no

  # Monitoring UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stockflow-kafka-ui
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: stockflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: stockflow-redis-insight
    ports:
      - "5540:5540"

volumes:
  timescale-data:
