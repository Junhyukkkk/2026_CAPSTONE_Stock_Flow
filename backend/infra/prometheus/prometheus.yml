global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'stockflow-realtime'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['stockflow-realtime:8081']
    scrape_interval: 5s

  # 아래 3개는 `docker compose --profile metrics up -d` 일 때만 UP 된다.
  # 프로파일을 안 켜면 target=down 으로 남지만 스택 동작에는 영향 없다.
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
