# Promtail: compose 로 뜬 모든 컨테이너의 stdout 로그를 Docker API 로 수집해 Loki 로 전송.
# 앱 자체 로그는 loki-logback-appender 가 직접 push 하고, Promtail 은
# kafka/redis/timescaledb/collector 등 나머지 컨테이너 로그를 담당한다.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      - replacement: 'docker'
        target_label: 'source'
