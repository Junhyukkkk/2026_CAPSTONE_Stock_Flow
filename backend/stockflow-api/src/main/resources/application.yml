server:
  port: 8080

spring:
  application:
    name: stockflow-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Alpaca API Configuration
alpaca:
  api:
    key: ${ALPACA_API_KEY:your-api-key}
    secret: ${ALPACA_API_SECRET:your-api-secret}
  websocket:
    url: ${ALPACA_WEBSOCKET_URL:wss://stream.data.alpaca.markets/v2/iex}

logging:
  level:
    com.stockflow: DEBUG
