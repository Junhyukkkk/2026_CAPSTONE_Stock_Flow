server:
  port: 8082

spring:
  application:
    name: stockflow-batch

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  batch:
    jdbc:
      initialize-schema: always

logging:
  level:
    com.stockflow: DEBUG
