<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow · 백테스팅</title>
    <link rel="stylesheet" href="assets/app.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        .advanced-settings { margin: 4px 0 14px; border-top: 1px solid var(--border); padding-top: 10px; }
        .advanced-settings summary { cursor: pointer; color: var(--muted); font-weight: 600; }
        .advanced-settings[open] summary { margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="page-title">백테스팅</div>
    <div class="page-sub">전략 설정 · 과거 일봉 데이터로 실행 · 수익률/MDD/승률 + 자산곡선 + 체결내역</div>

    <div class="grid grid-2 mt-16">
        <!-- 실행 폼 -->
        <div class="card">
            <h3>전략 실행</h3>
            <div class="field">
                <label>종목 심볼</label>
                <input type="text" id="symbol" placeholder="예: BTCUSDT" value="BTCUSDT">
            </div>
            <div class="field">
                <label>전략 타입</label>
                <select id="strategyType" onchange="renderParams()">
                    <option value="PREDICTION" selected>PREDICTION (예측 기반)</option>
                    <option value="BUY_AND_HOLD">BUY_AND_HOLD (매수 후 보유)</option>
                    <option value="MA_CROSSOVER">MA_CROSSOVER (이동평균 교차)</option>
                    <option value="RSI">RSI (과매수/과매도)</option>
                </select>
            </div>
            <div id="paramFields"></div>
            <div class="row">
                <div class="field"><label>초기 자본</label><input type="number" id="initialCash" value="10000"></div>
            </div>
            <div class="row">
                <div class="field"><label>시작일</label><input type="date" id="from"></div>
                <div class="field"><label>종료일</label><input type="date" id="to"></div>
            </div>
            <div class="flex">
                <button class="btn" id="runBtn" onclick="runBacktest()">선택 모델 실행</button>
                <button class="btn-ghost" id="compareBtn" onclick="runComparison()">예측 모델 비교</button>
                <button class="btn-ghost" onclick="saveStrategy()">전략 저장</button>
            </div>
        </div>

        <!-- 저장된 전략 -->
        <div class="card">
            <div class="flex-between">
                <h3>저장된 전략</h3>
                <button class="btn-ghost btn-sm" onclick="loadStrategies()">새로고침</button>
            </div>
            <table>
                <thead><tr><th>이름</th><th>심볼</th><th>타입</th><th>모델</th><th></th></tr></thead>
                <tbody id="strategyBody"><tr><td colspan="5" class="spinner">불러오는 중...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div id="comparison" class="card mt-16 hidden">
        <div class="flex-between">
            <h3>동일 조건 성과 비교</h3>
            <span class="muted" id="comparisonMeta"></span>
        </div>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>전략</th><th>누적 수익률</th><th>MDD</th><th>MAE</th><th>RMSE</th><th>BUY / HOLD / SELL</th><th>왕복거래</th><th></th></tr></thead>
                <tbody id="comparisonBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 결과 -->
    <div id="result" class="hidden">
        <div class="grid grid-4 mt-16">
            <div class="card stat"><div class="label">누적 수익률</div><div class="value" id="rTotal">-</div></div>
            <div class="card stat"><div class="label">CAGR</div><div class="value" id="rCagr">-</div></div>
            <div class="card stat"><div class="label">최대 낙폭 (MDD)</div><div class="value down" id="rMdd">-</div></div>
            <div class="card stat"><div class="label">승률 / 왕복거래</div><div class="value" id="rWin">-</div></div>
        </div>

        <div class="card mt-16">
            <div class="flex-between"><h3>가격 및 체결</h3><span class="muted">BUY / SELL</span></div>
            <div id="priceChart" class="chart-box"></div>
        </div>

        <div class="card mt-16">
            <div class="flex-between"><h3 id="resultTitle">자산 곡선</h3><span class="muted" id="resultMeta"></span></div>
            <div class="pane-label">평가금액(Equity)</div>
            <div id="equityChart" class="chart-box"></div>
            <div class="pane-label mt-16">낙폭(Drawdown %)</div>
            <div id="ddChart" class="chart-sm"></div>
        </div>

        <div class="card mt-16">
            <h3>체결 내역</h3>
            <div style="max-height:360px; overflow-y:auto;">
                <table>
                    <thead><tr><th>#</th><th>일자</th><th>구분</th><th>가격</th><th>수량</th><th>현금</th><th>평가금액</th><th>손익%</th></tr></thead>
                    <tbody id="tradeBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="assets/api.js"></script>
<script>
    renderNav('backtest.html');

    document.getElementById('from').value = isoDaysAgo(62);
    document.getElementById('to').value = isoDaysAgo(1);

    // ---- 전략 파라미터 동적 폼 ----
    const PARAM_DEFS = {
        BUY_AND_HOLD: [],
        MA_CROSSOVER: [['shortPeriod', '단기 기간', 5], ['longPeriod', '장기 기간', 20]],
        RSI: [['period', 'RSI 기간', 14], ['oversold', '과매도 기준', 30], ['overbought', '과매수 기준', 70]],
        PREDICTION: [],
    };
    function renderParams() {
        const type = document.getElementById('strategyType').value;
        const defs = PARAM_DEFS[type];
        const el = document.getElementById('paramFields');
        hideComparison();
        document.getElementById('compareBtn').classList.toggle('hidden', type !== 'PREDICTION');
        document.getElementById('runBtn').textContent =
            type === 'PREDICTION' ? '선택 모델 실행' : '백테스트 실행';
        if (type === 'PREDICTION') {
            el.innerHTML = `
                <div class="field">
                    <label>예측 모델</label>
                    <select data-param="model" data-param-type="string">
                        <option value="LOG_RETURN_ARIMA">로그수익률 ARIMA</option>
                        <option value="ARIMA">가격 ARIMA</option>
                        <option value="CHRONOS_BOLT">Chronos-Bolt tiny</option>
                    </select>
                </div>
                <details class="advanced-settings">
                    <summary>고급 설정</summary>
                    <div class="field">
                        <label>데이터 소스</label>
                        <select id="source">
                            <option value="BINANCE" selected>Binance (암호화폐)</option>
                            <option value="ALPACA">Alpaca (미국 주식)</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label>최소 학습 일수</label>
                            <input type="number" data-param="warmup" value="50" min="50" max="500"
                                   oninput="validateWarmupInput(this)">
                            <div class="hint" id="warmupHelp">최소 50개의 실제 일봉 데이터가 필요합니다.</div>
                        </div>
                        <div class="field"><label>모델 갱신 주기(일)</label><input type="number" data-param="refitEvery" value="5" min="1" max="30"></div>
                    </div>
                    <div class="row">
                        <div class="field"><label>변동성 계산 기간</label><input type="number" data-param="volatilityWindow" value="20" min="5"></div>
                        <div class="field"><label>변동성 기준 계수</label><input type="number" data-param="volatilityMultiplier" value="0.25" min="0" max="5" step="0.05"></div>
                    </div>
                    <div class="row">
                        <div class="field"><label>수수료(bp)</label><input type="number" data-param="feeBps" value="10" min="0" step="1"></div>
                        <div class="field"><label>슬리피지(bp)</label><input type="number" data-param="slippageBps" value="5" min="0" step="1"></div>
                    </div>
                    <input type="hidden" data-param="maxHistory" value="200">
                </details>`;
            return;
        }
        if (!defs.length) { el.innerHTML = '<div class="hint" style="margin-bottom:14px;">파라미터 없음 (시작일 매수 → 종료일 평가)</div>'; return; }
        el.innerHTML = '<div class="row">' + defs.map(([k, label, def]) =>
            `<div class="field"><label>${label}</label><input type="number" data-param="${k}" value="${def}"></div>`).join('') + '</div>';
    }
    function collectParams() {
        const p = {};
        document.querySelectorAll('#paramFields [data-param]').forEach(i => {
            p[i.dataset.param] = i.dataset.paramType === 'string' ? i.value : Number(i.value);
        });
        return p;
    }
    function validateWarmupInput(input, notify = false) {
        const value = Number(input.value);
        const invalid = !Number.isInteger(value) || value < 50;
        const message = '최소 학습 일수는 50일 이상으로 입력해 주세요.';
        input.setCustomValidity(invalid ? message : '');
        const help = document.getElementById('warmupHelp');
        if (help) {
            help.textContent = invalid ? message : '최소 50개의 실제 일봉 데이터가 필요합니다.';
            help.style.color = invalid ? 'var(--red)' : '';
        }
        if (invalid && notify) toast(message, 'err');
        return !invalid;
    }
    function validatePredictionSettings() {
        if (document.getElementById('strategyType').value !== 'PREDICTION') return true;
        const input = document.querySelector('#paramFields [data-param="warmup"]');
        if (input && !validateWarmupInput(input, true)) {
            input.focus();
            input.reportValidity();
            return false;
        }
        return true;
    }
    function hideComparison() {
        document.getElementById('comparison').classList.add('hidden');
        document.getElementById('comparisonBody').innerHTML = '';
    }
    function friendlyBacktestError(error) {
        const message = String(error?.message || error || '알 수 없는 오류');
        const observations = message.match(/at least (\d+) observations are required before from_date(?:.*?found (\d+))?/i);
        if (observations) {
            const actual = observations[2] ? ` 현재 사용 가능한 데이터는 ${observations[2]}개입니다.` : '';
            return `선택한 시작일 이전의 학습 데이터가 부족합니다. 최소 ${observations[1]}개의 실제 일봉 데이터가 필요합니다.${actual} 시작일을 늦춰 주세요.`;
        }
        if (/warmup must be between 50 and 500/i.test(message)) {
            return '최소 학습 일수는 50일 이상 500일 이하로 입력해 주세요.';
        }
        if (/insufficient history|학습.*부족|데이터가 부족/i.test(message)) {
            return '예측에 필요한 과거 데이터가 부족합니다. 시작일을 늦추거나 최소 학습 일수를 확인해 주세요.';
        }
        if (/missing dates/i.test(message)) {
            return '선택한 구간의 일봉 데이터가 중간에 누락되어 있습니다. 데이터 보완 후 다시 실행해 주세요.';
        }
        if (/No daily OHLCV data|일봉 데이터를 찾을 수 없습니다|no daily bars/i.test(message)) {
            return '선택한 종목과 기간에 사용할 수 있는 일봉 데이터가 없습니다.';
        }
        if (/from.*(?:earlier|<=)|시작일/i.test(message) && /to|종료일/i.test(message)) {
            return '시작일은 종료일보다 빠르거나 같아야 합니다.';
        }
        if (/Failed to fetch|연결할 수 없습니다|Service Unavailable/i.test(message)) {
            return '백테스트 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.';
        }
        if (error?.status === 404) {
            return '저장된 전략을 찾을 수 없습니다. 목록을 새로고침한 뒤 다시 시도해 주세요.';
        }
        return message;
    }
    renderParams();

    function buildRunBody() {
        const params = collectParams();
        if (document.getElementById('strategyType').value === 'PREDICTION') {
            params.source = document.getElementById('source').value;
        }
        return {
            symbol: document.getElementById('symbol').value.trim().toUpperCase(),
            strategyType: document.getElementById('strategyType').value,
            params,
            initialCash: Number(document.getElementById('initialCash').value),
            from: document.getElementById('from').value,
            to: document.getElementById('to').value,
        };
    }

    // ---- 백테스트 실행 ----
    async function runBacktest() {
        if (!validatePredictionSettings()) return;
        const body = buildRunBody();
        if (!body.symbol) { toast('종목 심볼을 입력하세요', 'err'); return; }
        hideComparison();
        const button = document.getElementById('runBtn');
        try {
            button.disabled = true;
            button.textContent = '실행 중...';
            toast('백테스트 실행 중...');
            const run = await API.runAdHoc(body);
            await showResult(run);
            toast('백테스트 완료', 'ok');
        } catch (e) { toast('실행 실패: ' + friendlyBacktestError(e), 'err'); }
        finally {
            button.disabled = false;
            button.textContent = body.strategyType === 'PREDICTION'
                ? '선택 모델 실행' : '백테스트 실행';
        }
    }

    let eqChart = null, ddChart = null, priceChart = null;
    async function showResult(run) {
        document.getElementById('result').classList.remove('hidden');
        const tr = Number(run.totalReturnPct);
        document.getElementById('rTotal').textContent = fmtPct(run.totalReturnPct);
        document.getElementById('rTotal').className = 'value ' + signClass(tr);
        document.getElementById('rCagr').textContent = fmtPct(run.cagrPct);
        document.getElementById('rMdd').textContent = fmtPct(run.mddPct);
        document.getElementById('rWin').textContent =
            `${run.winRatePct != null ? fmtNum(run.winRatePct) + '%' : '-'} / ${run.tradeCount ?? 0}건`;
        document.getElementById('resultTitle').textContent = `${run.symbol} · ${run.strategyType}`;
        document.getElementById('resultMeta').textContent =
            `${run.fromDate} ~ ${run.toDate} · 초기 ${fmtNum(run.initialCash)} → 최종 ${fmtNum(run.finalEquity)} · ${run.barCount ?? 0} bars`
            + (run.strategyType === 'PREDICTION' ? ` · ${run.params?.model ?? ''}` : '');

        const [curve, trades, prices] = await Promise.all([
            API.equityCurve(run.id),
            API.runTrades(run.id),
            API.ohlcv(run.symbol, run.fromDate, run.toDate),
        ]);

        // 가격 및 실제 체결
        if (priceChart) priceChart.remove();
        const elP = document.getElementById('priceChart'); elP.innerHTML = '';
        if (prices?.length) {
            priceChart = LightweightCharts.createChart(elP, baseChartOpts(360));
            const candles = priceChart.addCandlestickSeries({
                upColor: '#20c997', downColor: '#ff5e6c',
                wickUpColor: '#20c997', wickDownColor: '#ff5e6c',
                borderVisible: false,
            });
            candles.setData(prices.map(p => ({
                time: p.date, open: +p.open, high: +p.high, low: +p.low, close: +p.close,
            })));
            candles.setMarkers((trades || []).map(t => ({
                time: t.tradeDate,
                position: t.side === 'BUY' ? 'belowBar' : 'aboveBar',
                color: t.side === 'BUY' ? '#20c997' : '#ff5e6c',
                shape: t.side === 'BUY' ? 'arrowUp' : 'arrowDown',
                text: t.side,
            })));
            priceChart.timeScale().fitContent();
        } else {
            elP.innerHTML = '<div class="spinner">가격 데이터가 없습니다.</div>';
        }

        // 자산 곡선
        if (eqChart) eqChart.remove();
        if (ddChart) ddChart.remove();
        const elE = document.getElementById('equityChart'); elE.innerHTML = '';
        const elD = document.getElementById('ddChart'); elD.innerHTML = '';
        if (curve?.length) {
            eqChart = LightweightCharts.createChart(elE, baseChartOpts(360));
            eqChart.addAreaSeries({ lineColor: '#00d4ff', topColor: '#00d4ff44', bottomColor: '#00d4ff00', lineWidth: 2 })
                .setData(curve.map(p => ({ time: p.tradeDate, value: +p.equity })));
            eqChart.timeScale().fitContent();

            ddChart = LightweightCharts.createChart(elD, baseChartOpts(180));
            ddChart.addAreaSeries({ lineColor: '#ff5e6c', topColor: '#ff5e6c00', bottomColor: '#ff5e6c44', lineWidth: 1 })
                .setData(curve.map(p => ({ time: p.tradeDate, value: +p.drawdownPct })));
            ddChart.timeScale().fitContent();
        } else {
            elE.innerHTML = '<div class="spinner">자산 곡선 데이터가 없습니다.</div>';
        }

        // 체결 내역
        const body = document.getElementById('tradeBody');
        body.innerHTML = trades?.length ? trades.map(t => `
            <tr>
                <td>${t.seq}</td><td>${t.tradeDate}</td>
                <td class="${t.side==='BUY'?'up':'down'}">${t.side}</td>
                <td>${fmtPrice(t.price)}</td><td>${fmtNum(t.quantity, 4)}</td>
                <td>${fmtNum(t.cashAfter)}</td><td>${fmtNum(t.equityAfter)}</td>
                <td class="${signClass(t.pnlPct)}">${t.pnlPct != null ? fmtPct(t.pnlPct) : '-'}</td>
            </tr>`).join('') : '<tr><td colspan="8" class="muted center">체결 없음</td></tr>';
    }

    let comparisonRuns = [];
    async function runComparison() {
        if (!validatePredictionSettings()) return;
        const base = buildRunBody();
        if (!base.symbol) { toast('종목 심볼을 입력하세요', 'err'); return; }
        if (base.strategyType !== 'PREDICTION') {
            toast('예측 모델 비교는 PREDICTION 전략에서 실행하세요', 'err');
            return;
        }

        const compareButton = document.getElementById('compareBtn');
        const runButton = document.getElementById('runBtn');
        const predictionParams = { ...base.params };
        const models = ['ARIMA', 'LOG_RETURN_ARIMA', 'CHRONOS_BOLT'];
        comparisonRuns = [];
        try {
            compareButton.disabled = true;
            runButton.disabled = true;
            compareButton.textContent = '비교 중 0/4';
            comparisonRuns.push(await API.runAdHoc({
                ...base, strategyType: 'BUY_AND_HOLD', params: {},
            }));
            for (let i = 0; i < models.length; i++) {
                compareButton.textContent = `비교 중 ${i + 2}/4`;
                comparisonRuns.push(await API.runAdHoc({
                    ...base,
                    strategyType: 'PREDICTION',
                    params: { ...predictionParams, model: models[i] },
                }));
            }
            renderComparison();
            toast('모델 비교 완료', 'ok');
        } catch (e) {
            toast('비교 실패: ' + friendlyBacktestError(e), 'err');
        } finally {
            compareButton.disabled = false;
            runButton.disabled = false;
            compareButton.textContent = '예측 모델 비교';
        }
    }

    function renderComparison() {
        const labels = {
            BUY_AND_HOLD: 'Buy & Hold',
            ARIMA: '가격 ARIMA',
            LOG_RETURN_ARIMA: '로그수익률 ARIMA',
            CHRONOS_BOLT: 'Chronos-Bolt tiny',
        };
        document.getElementById('comparison').classList.remove('hidden');
        document.getElementById('comparisonMeta').textContent =
            `${comparisonRuns[0].symbol} · ${comparisonRuns[0].fromDate} ~ ${comparisonRuns[0].toDate}`;
        document.getElementById('comparisonBody').innerHTML = comparisonRuns.map((run, index) => {
            const key = run.strategyType === 'PREDICTION' ? run.params.model : run.strategyType;
            const signals = run.strategyType === 'PREDICTION'
                ? `${run.params.buySignalCount ?? 0} / ${run.params.holdSignalCount ?? 0} / ${run.params.sellSignalCount ?? 0}`
                : '-';
            return `<tr>
                <td>${labels[key] ?? key}</td>
                <td class="${signClass(run.totalReturnPct)}">${fmtPct(run.totalReturnPct)}</td>
                <td>${fmtPct(run.mddPct)}</td>
                <td>${run.strategyType === 'PREDICTION' ? fmtPrice(run.params.mae) : '-'}</td>
                <td>${run.strategyType === 'PREDICTION' ? fmtPrice(run.params.rmse) : '-'}</td>
                <td>${signals}</td>
                <td>${run.tradeCount ?? 0}건</td>
                <td><button class="btn-ghost btn-sm" onclick="showComparisonRun(${index})">보기</button></td>
            </tr>`;
        }).join('');
    }

    async function showComparisonRun(index) {
        await showResult(comparisonRuns[index]);
        document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    }

    function baseChartOpts(height) {
        return {
            height,
            layout: { background: { color: 'transparent' }, textColor: '#8b92a8' },
            grid: { vertLines: { color: '#2d3346' }, horzLines: { color: '#2d3346' } },
            timeScale: { borderColor: '#2d3346' },
            rightPriceScale: { borderColor: '#2d3346' },
        };
    }

    // ---- 전략 저장/목록 ----
    async function saveStrategy() {
        if (!validatePredictionSettings()) return;
        const config = buildRunBody();
        const symbol = config.symbol;
        const type = config.strategyType;
        if (!symbol) { toast('종목 심볼을 입력하세요', 'err'); return; }
        const body = {
            name: type === 'PREDICTION'
                ? `${symbol}-${config.params.model}` : `${symbol}-${type}`,
            symbol,
            strategyType: type,
            params: config.params,
            initialCash: config.initialCash,
        };
        try {
            await API.createStrategy(body);
            toast('전략 저장됨', 'ok');
            loadStrategies();
        } catch (e) { toast('저장 실패: ' + friendlyBacktestError(e), 'err'); }
    }

    async function loadStrategies() {
        try {
            const list = await API.strategies() || [];
            const body = document.getElementById('strategyBody');
            body.innerHTML = list.length ? list.map(s => `
                <tr>
                    <td>${s.name}</td><td>${s.symbol}</td><td>${s.strategyType}</td>
                    <td>${s.strategyType === 'PREDICTION' ? (s.params?.model ?? '-') : '-'}</td>
                    <td style="white-space:nowrap;">
                        <button class="btn btn-sm" onclick="runSaved(${s.id})">실행</button>
                        <button class="btn-danger btn-sm" onclick="delStrategy(${s.id})">삭제</button>
                    </td>
                </tr>`).join('') : '<tr><td colspan="5" class="muted center">저장된 전략 없음</td></tr>';
        } catch (e) { toast('전략 목록 조회 실패: ' + friendlyBacktestError(e), 'err'); }
    }

    async function runSaved(id) {
        try {
            const run = await API.runSaved(id, document.getElementById('from').value, document.getElementById('to').value);
            if (!run) { toast('전략을 찾을 수 없습니다', 'err'); return; }
            await showResult(run);
            window.scrollTo({ top: document.getElementById('result').offsetTop, behavior: 'smooth' });
            toast('실행 완료', 'ok');
        } catch (e) { toast('실행 실패: ' + friendlyBacktestError(e), 'err'); }
    }

    async function delStrategy(id) {
        if (!confirm('이 전략을 삭제할까요?')) return;
        await API.deleteStrategy(id);
        loadStrategies();
    }

    loadStrategies();
</script>
</body>
</html>
