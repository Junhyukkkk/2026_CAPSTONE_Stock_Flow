<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - 실시간 가격 모니터</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .status.connected { background: #1b4332; color: #40c057; }
        .status.disconnected { background: #5c1a1a; color: #ff6b6b; }
        .status.connecting { background: #4a3f00; color: #ffd43b; }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #2d2d44;
            color: #fff;
            font-size: 14px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-subscribe { background: #00d4ff; color: #000; }
        .btn-subscribe:hover { background: #00a8cc; }
        .btn-clear { background: #ff6b6b; color: #fff; }
        .btn-clear:hover { background: #ee5a5a; }

        .subscriptions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .subscription-tag {
            background: #2d2d44;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .subscription-tag .remove {
            cursor: pointer;
            color: #ff6b6b;
        }

        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .price-card {
            background: #2d2d44;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        .price-card.flash-up { animation: flashGreen 0.5s; }
        .price-card.flash-down { animation: flashRed 0.5s; }
        @keyframes flashGreen { 0%, 100% { background: #2d2d44; } 50% { background: #1b4332; } }
        @keyframes flashRed { 0%, 100% { background: #2d2d44; } 50% { background: #5c1a1a; } }

        .price-card .symbol {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .price-card .market-type {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            background: #4a4a6a;
        }
        .price-card .market-type.crypto { background: #f7931a33; color: #f7931a; }
        .price-card .market-type.stock { background: #00d4ff33; color: #00d4ff; }

        .price-card .price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .price-card .change {
            font-size: 14px;
        }
        .price-card .change.up { color: #40c057; }
        .price-card .change.down { color: #ff6b6b; }
        .price-card .change.neutral { color: #888; }

        .price-card .meta {
            margin-top: 12px;
            font-size: 11px;
            color: #888;
        }

        .log-section {
            background: #0d0d1a;
            border-radius: 12px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-section h3 {
            margin-bottom: 10px;
            color: #00d4ff;
        }
        .log-entry {
            font-family: monospace;
            font-size: 12px;
            padding: 5px 0;
            border-bottom: 1px solid #2d2d44;
        }
        .log-entry .time { color: #888; }
        .log-entry .symbol { color: #00d4ff; }
        .log-entry .price { color: #40c057; }
    </style>
</head>
<body>
    <h1>StockFlow 실시간 가격 모니터</h1>

    <div id="status" class="status disconnected">연결 안됨</div>

    <div class="controls">
        <input type="text" id="symbolInput" placeholder="종목 심볼 (예: BTCUSDT)" />
        <button class="btn-subscribe" onclick="subscribeSymbol()">구독</button>
        <button class="btn-clear" onclick="clearAll()">전체 삭제</button>
    </div>

    <div id="subscriptions" class="subscriptions"></div>

    <div id="priceGrid" class="price-grid"></div>

    <div class="log-section">
        <h3>메시지 로그</h3>
        <div id="log"></div>
    </div>

    <script>
        let stompClient = null;
        let subscriptions = {};
        let priceData = {};

        function connect() {
            updateStatus('connecting', '연결 중...');

            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // 콘솔 로그 비활성화

            stompClient.connect({},
                function(frame) {
                    updateStatus('connected', 'WebSocket 연결됨');
                    addLog('시스템', '서버에 연결되었습니다.');
                },
                function(error) {
                    updateStatus('disconnected', '연결 실패 - 5초 후 재시도');
                    addLog('에러', '연결 실패: ' + error);
                    setTimeout(connect, 5000);
                }
            );
        }

        function updateStatus(state, text) {
            const el = document.getElementById('status');
            el.className = 'status ' + state;
            el.textContent = text;
        }

        function subscribeSymbol() {
            const input = document.getElementById('symbolInput');
            const symbol = input.value.trim().toUpperCase();

            if (!symbol) {
                alert('종목 심볼을 입력하세요.');
                return;
            }

            if (subscriptions[symbol]) {
                alert('이미 구독 중인 종목입니다.');
                return;
            }

            if (!stompClient || !stompClient.connected) {
                alert('서버에 연결되지 않았습니다.');
                return;
            }

            const sub = stompClient.subscribe('/topic/price/' + symbol, function(message) {
                const data = JSON.parse(message.body);
                handlePriceUpdate(data);
            });

            subscriptions[symbol] = sub;
            updateSubscriptionTags();
            addLog('구독', symbol + ' 종목 구독 시작');
            input.value = '';
        }

        function unsubscribeSymbol(symbol) {
            if (subscriptions[symbol]) {
                subscriptions[symbol].unsubscribe();
                delete subscriptions[symbol];
                delete priceData[symbol];
                updateSubscriptionTags();
                renderPriceCards();
                addLog('구독해제', symbol + ' 종목 구독 해제');
            }
        }

        function updateSubscriptionTags() {
            const container = document.getElementById('subscriptions');
            container.innerHTML = Object.keys(subscriptions).map(symbol =>
                `<div class="subscription-tag">
                    ${symbol}
                    <span class="remove" onclick="unsubscribeSymbol('${symbol}')">&times;</span>
                </div>`
            ).join('');
        }

        function handlePriceUpdate(data) {
            const prevPrice = priceData[data.symbol]?.price;
            priceData[data.symbol] = data;
            renderPriceCards(data.symbol, prevPrice);
            addLog(data.symbol, `가격: ${formatPrice(data.price)} | 등락: ${formatChange(data.changePercent)}%`);
        }

        function renderPriceCards(flashSymbol = null, prevPrice = null) {
            const container = document.getElementById('priceGrid');
            container.innerHTML = Object.values(priceData).map(data => {
                const changeClass = data.changePercent > 0 ? 'up' : data.changePercent < 0 ? 'down' : 'neutral';
                const changeSign = data.changePercent > 0 ? '+' : '';
                const marketClass = data.marketType?.toLowerCase() || '';

                let flashClass = '';
                if (flashSymbol === data.symbol && prevPrice !== null) {
                    flashClass = data.price > prevPrice ? 'flash-up' : data.price < prevPrice ? 'flash-down' : '';
                }

                return `
                    <div class="price-card ${flashClass}">
                        <div class="symbol">
                            ${data.symbol}
                            <span class="market-type ${marketClass}">${data.marketType || 'N/A'}</span>
                        </div>
                        <div class="price">${formatPrice(data.price)}</div>
                        <div class="change ${changeClass}">
                            ${changeSign}${data.change?.toFixed(2) || '0.00'}
                            (${changeSign}${formatChange(data.changePercent)}%)
                        </div>
                        <div class="meta">
                            거래소: ${data.exchange || 'N/A'} |
                            시간: ${formatTime(data.timestamp)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatPrice(price) {
            if (price == null) return '0';
            if (price >= 1) return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            return price.toFixed(8);
        }

        function formatChange(percent) {
            if (percent == null) return '0.00';
            return percent.toFixed(2);
        }

        function formatTime(timestamp) {
            if (!timestamp) return 'N/A';
            return new Date(timestamp).toLocaleTimeString('ko-KR');
        }

        function addLog(tag, message) {
            const log = document.getElementById('log');
            const time = new Date().toLocaleTimeString('ko-KR');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="time">[${time}]</span> <span class="symbol">[${tag}]</span> ${message}`;
            log.insertBefore(entry, log.firstChild);

            // 로그 100개 제한
            while (log.children.length > 100) {
                log.removeChild(log.lastChild);
            }
        }

        function clearAll() {
            Object.keys(subscriptions).forEach(symbol => {
                subscriptions[symbol].unsubscribe();
            });
            subscriptions = {};
            priceData = {};
            updateSubscriptionTags();
            renderPriceCards();
            document.getElementById('log').innerHTML = '';
            addLog('시스템', '전체 삭제 완료');
        }

        // 엔터키로 구독
        document.getElementById('symbolInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') subscribeSymbol();
        });

        // 페이지 로드 시 연결
        window.onload = connect;
    </script>
</body>
</html>
