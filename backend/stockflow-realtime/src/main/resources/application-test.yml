server:
  port: 8081

spring:
  application:
    name: stockflow-realtime
  main:
    allow-bean-definition-overriding: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: latest
      enable-auto-commit: false
      group:
        realtime: ${KAFKA_CONSUMER_GROUP_REALTIME:realtime-test-group}
        storage: ${KAFKA_CONSUMER_GROUP_STORAGE:storage-test-group}
      # 배치 처리 설정
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:100}
      fetch-min-size: ${KAFKA_CONSUMER_FETCH_MIN_SIZE:1}
      fetch-max-wait: ${KAFKA_CONSUMER_FETCH_MAX_WAIT:500}
      # 리밸런싱 재현용: poll 간격 30초 제한
      properties:
        max.poll.interval.ms: 30000
    topic:
      normalized: ${KAFKA_TOPIC_NORMALIZED:market.normalized.test}
      dlq: ${KAFKA_TOPIC_DLQ:market.dlq.test}
    # 배치 처리 설정
    batch:
      size: ${KAFKA_BATCH_SIZE:100}
      timeout-ms: ${KAFKA_BATCH_TIMEOUT_MS:1000}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:stockflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        # 트랜잭션 설정
        connection:
          provider_disables_autocommit: true
        # 배치 처리 최적화
        jdbc:
          batch_size: ${JPA_BATCH_SIZE:50}
          order_inserts: true
          order_updates: true
        # 성능 최적화
        format_sql: false

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.stockflow: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.redis: INFO

# Consumer 코드가 참조하는 property path (spring.kafka와 별도)
kafka:
  topic:
    normalized: market.normalized.test
    dlq: market.dlq.test
    retry: market.retry.test
  consumer:
    group:
      realtime: realtime-test-group
      storage: storage-test-group

# 리밸런싱 재현용 재시도 설정 (5초 → 25초 → 125초 = 155초 > 30초 max.poll.interval.ms)
retry:
  initial-delay-ms: 5000
  multiplier: 5.0
  max-retries: 3
  max-delay-ms: 300000
