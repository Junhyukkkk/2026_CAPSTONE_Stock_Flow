server:
  port: 8081

spring:
  application:
    name: stockflow-realtime
  main:
    allow-bean-definition-overriding: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: latest
      enable-auto-commit: false
      group:
        realtime: ${KAFKA_CONSUMER_GROUP_REALTIME:realtime-test-group}
        storage: ${KAFKA_CONSUMER_GROUP_STORAGE:storage-test-group}
        retry: ${KAFKA_CONSUMER_GROUP_RETRY:retry-test-group}
      # 배치 처리 설정
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:100}
      fetch-min-size: ${KAFKA_CONSUMER_FETCH_MIN_SIZE:1}
      fetch-max-wait: ${KAFKA_CONSUMER_FETCH_MAX_WAIT:500}
      # 동시성 설정 (파티션 수와 맞춤)
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:12}
      properties:
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:300000}
    topic:
      normalized: ${KAFKA_TOPIC_NORMALIZED:market.normalized.test}
      retry: ${KAFKA_TOPIC_RETRY:market.retry.test}
      dlq: ${KAFKA_TOPIC_DLQ:market.dlq.test}
    # 배치 처리 설정
    batch:
      size: ${KAFKA_BATCH_SIZE:100}
      timeout-ms: ${KAFKA_BATCH_TIMEOUT_MS:1000}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:stockflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        # 트랜잭션 설정
        connection:
          provider_disables_autocommit: true
        # 배치 처리 최적화
        jdbc:
          batch_size: ${JPA_BATCH_SIZE:50}
          order_inserts: true
          order_updates: true
        # 성능 최적화
        format_sql: false

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.stockflow: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.redis: INFO

# Retry 토픽 방식 설정
retry:
  mode: ${RETRY_MODE:sync}
  max-retries: ${RETRY_MAX_RETRIES:3}
  delay-ms: ${RETRY_DELAY_MS:5000}
  initial-delay-ms: ${RETRY_INITIAL_DELAY_MS:1000}
  multiplier: ${RETRY_MULTIPLIER:2.0}
  max-delay-ms: ${RETRY_MAX_DELAY_MS:60000}
  use-jitter: ${RETRY_USE_JITTER:true}
  jitter-ratio: ${RETRY_JITTER_RATIO:0.2}
