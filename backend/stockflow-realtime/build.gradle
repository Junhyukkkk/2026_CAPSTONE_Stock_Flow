apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':stockflow-core')

    // Web (내장 서버)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'
    // Snappy 압축 지원
    implementation 'org.xerial.snappy:snappy-java:1.1.10.5'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // WebSocket (STOMP)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JPA + PostgreSQL (TimescaleDB) - Storage Consumer용
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // DB 스키마 마이그레이션 (Timescale hypertable 포함)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Spring Batch (일일 지표 계산·데이터 정합성 검증 Job)
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // Swagger / OpenAPI (Spring Boot 3.4.x 호환: 2.6.0은 Framework 6.2에서 제거된 API 호출로 /v3/api-docs 500 발생)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // Actuator (모니터링 및 헬스체크)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Micrometer (메트릭 수집)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Sentry (에러 트래킹 - ERROR 로그를 이벤트로 전송, GlitchTip 호환)
    // SENTRY_DSN 이 비어 있으면 자동 비활성(no-op) 되므로 로컬/테스트 환경에서도 안전
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.18.1'
    implementation 'io.sentry:sentry-logback:7.18.1'

    // Loki 로그 수집 (logback → Loki HTTP push, Grafana 에서 조회)
    // loki 프로파일에서만 root 에 부착됨 (logback-spring.xml 참고)
    implementation 'com.github.loki4j:loki-logback-appender:1.5.2'

    // Test
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'com.h2database:h2' // 인메모리 DB 테스트용
}
