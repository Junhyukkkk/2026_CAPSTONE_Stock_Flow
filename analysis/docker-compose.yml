services:
  analysis:
    build: .
    container_name: stockflow-analysis
    ports:
      - "127.0.0.1:8000:8000"  # 외부 비공개 (Spring 은 도커 네트워크로 호출)
    environment:
      # infra_default 네트워크 내부의 TimescaleDB 컨테이너를 바라봄
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_NAME: stockflow
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MODEL_DIR: /app/models
      DEFAULT_INTERVAL: 1m
    volumes:
      - ./models:/app/models
    networks:
      - infra
    restart: unless-stopped

networks:
  # backend/infra/docker-compose.yml 가 만든 네트워크에 합류
  infra:
    external: true
    name: infra_default
