version: '3.8'

services:
  # Binance 데이터 수집기
  binance-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockflow-binance-collector
    command: python binance_producer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - BINANCE_TOP_SYMBOLS_LIMIT=${BINANCE_TOP_SYMBOLS_LIMIT:-300}
      - KAFKA_TOPIC_NAME=${KAFKA_TOPIC_NAME:-market.normalized}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - stockflow-network
    restart: unless-stopped
    # Kafka는 backend/infra에서 실행 중
    # depends_on:
    #   - kafka
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Alpaca 데이터 수집기
  alpaca-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockflow-alpaca-collector
    command: python alpaca_producer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - ALPACA_WEBSOCKET_URL=${ALPACA_WEBSOCKET_URL:-wss://stream.data.alpaca.markets/v2/iex}
      - KAFKA_TOPIC_NAME=${KAFKA_TOPIC_NAME:-market.normalized}
      - ALPACA_SUBSCRIBE_ALL_STOCKS=${ALPACA_SUBSCRIBE_ALL_STOCKS:-true}
      - ALPACA_SUBSCRIBE_SYMBOLS=${ALPACA_SUBSCRIBE_SYMBOLS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - stockflow-network
    restart: unless-stopped
    # Kafka는 backend/infra에서 실행 중
    # depends_on:
    #   - kafka
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 미국 주식 시세 시뮬레이터 (가짜 체결 생성기) — 기본 up 에는 포함되지 않는다
  # ⚠️ source=SIMULATOR 시뮬레이션 데이터. 실행: docker compose --profile sim up -d stock-simulator
  stock-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockflow-stock-simulator
    command: python stock_simulator.py
    profiles: ["sim"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_TOPIC_NAME=${KAFKA_TOPIC_NAME:-market.normalized}
      - SIM_SYMBOLS_FILE=${SIM_SYMBOLS_FILE:-simulator/universe.csv}
      # 발생률 모드: realistic(기본) = 종목별 실제 하루 체결 수(universe.csv daily_trades) 기반, SIM_TOTAL_TPS 는 무시된다
      - SIM_RATE_MODE=${SIM_RATE_MODE:-realistic}
      # realistic 발생률 배율. 1.0 이면 합계 평균 약 832 TPS(하루 약 1,950만 건)라 서버 보호용 기본값은 0.25 (평균 약 208 TPS)
      - SIM_RATE_SCALE=${SIM_RATE_SCALE:-0.25}
      # SIM_TOTAL_TPS 는 SIM_RATE_MODE=fixed 일 때만 쓰인다(weight 비례 고정 발생률)
      - SIM_TOTAL_TPS=${SIM_TOTAL_TPS:-100}
      - SIM_MARKET_HOURS=${SIM_MARKET_HOURS:-always}
      - SIM_SEED=${SIM_SEED:-}
      - SIM_DRY_RUN=${SIM_DRY_RUN:-false}
      - SIM_TICK_INTERVAL_MS=${SIM_TICK_INTERVAL_MS:-50}
      - SIM_PRICE_SOURCE=${SIM_PRICE_SOURCE:-static}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - stockflow-network
    restart: unless-stopped
    # Kafka는 backend/infra에서 실행 중
    # depends_on:
    #   - kafka
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  stockflow-network:
    external: true
    name: infra_default
